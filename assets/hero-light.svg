<svg xmlns="http://www.w3.org/2000/svg" width="880" height="386" viewBox="0 0 880 386" role="img" aria-labelledby="t d"><title id="t">Marcos Tolosa, pentester</title><desc id="d">Marcos Tolosa, pentester and red teamer. Bug bounty hunter and reverse engineer in Rio de Janeiro, Brazil. Found CVE-2025-10230 (CVSS 10.0) in Samba. 6x U.S. Government Hall of Fame. 93.75% accuracy across 15 valid reports.</desc><style>@font-face{font-family:disp800;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:disp500;src:url(data:font/woff2;base64,) format("woff2")}</style><text x="-2.0" y="68.0" font-family="disp800" font-size="68" fill="#1f2328" text-anchor="start" xml:space="preserve" letter-spacing="-2.38">Marcos Tolosa.</text><text x="-2.0" y="140.1" font-family="disp800" font-size="68" fill="#59636e" text-anchor="start" xml:space="preserve" letter-spacing="-2.38">Pentester and red teamer.</text><text x="0.0" y="186.1" font-family="disp500" font-size="22" fill="#59636e" text-anchor="start" xml:space="preserve">Bug bounty hunter and reverse engineer in Rio de Janeiro, Brazil.</text><line x1="0" y1="238.07999999999998" x2="880" y2="238.07999999999998" stroke="#d1d9e0"/><text x="-1.0" y="310.1" font-family="disp800" font-size="56" fill="#9a6700" text-anchor="start" xml:space="preserve" letter-spacing="-1.68">10.0</text><text x="0.0" y="344.1" font-family="disp500" font-size="16.5" fill="#59636e" text-anchor="start" xml:space="preserve">CVSS score. Critical flaw in Samba,</text><text x="0.0" y="367.1" font-family="disp500" font-size="16.5" fill="#59636e" text-anchor="start" xml:space="preserve">hidden for 13 years.</text><text x="292.3" y="310.1" font-family="disp800" font-size="56" fill="#1f2328" text-anchor="start" xml:space="preserve" letter-spacing="-1.68">6×</text><text x="293.3" y="344.1" font-family="disp500" font-size="16.5" fill="#59636e" text-anchor="start" xml:space="preserve">U.S. Government Hall of Fame,</text><text x="293.3" y="367.1" font-family=