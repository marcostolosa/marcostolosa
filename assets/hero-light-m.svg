<svg xmlns="http://www.w3.org/2000/svg" width="420" height="594" viewBox="0 0 420 594" role="img" aria-labelledby="t d"><title id="t">Marcos Tolosa, pentester</title><desc id="d">Marcos Tolosa, pentester and red teamer. Bug bounty hunter and reverse engineer in Rio de Janeiro, Brazil. Found CVE-2025-10230 (CVSS 10.0) in Samba. 6x U.S. Government Hall of Fame. 93.75% accuracy across 15 valid reports.</desc><style>@font-face{font-family:disp800;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:disp500;src:url(data:font/woff2;base64,) format("woff2")}</style><text x="-1.0" y="35.0" font-family="disp800" font-size="35" fill="#1f2328" text-anchor="start" xml:space="preserve" letter-spacing="-1.23">Marcos Tolosa.</text><text x="-1.0" y="72.8" font-family="disp800" font-size="35" fill="#59636e" text-anchor="start" xml:space="preserve" letter-spacing="-1.23">Pentester and red teamer.</text><text x="0.0" y="112.8" font-family="disp500" font-size="18" fill="#59636e" text-anchor="start" xml:space="preserve">Bug bounty hunter and reverse engineer</text><text x="0.0" y="138.8" font-family="disp500" font-size="18" fill="#59636e" text-anchor="start" xml:space="preserve">in Rio de Janeiro, Brazil.</text><line x1="0" y1="192.8" x2="420" y2="192.8" stroke="#d1d9e0"/><text x="-1.0" y="246.8" font-family="disp800" font-size="46" fill="#9a6700" text-anchor="start" xml:space="preserve" letter-spacing="-1.38">10.0</text><text x="0.0" y="276.8" font-family="disp500" font-size="17" fill="#59636e" text-anchor="start" xml:space="preserve">CVSS score. Critical flaw in Samba,</text><text x="0.0" y="300.8" font-family="disp500" font-size="17" fill="#59636e" text-anchor="start" xml:space="preserve">hidden for 13 years.</text><line x1="0" y1="324.8" x2="420" y2="324.8" stroke="#d1d9e0"/><text x="-1.0" y="378.8" font-family="disp800" font-size="46" fill="#1f2328" text-anchor="start" xml:space="preserve" letter-spacing="-1.38">6×</text><text x="0.0" y="408.8" font-family="disp500" font-size="17" fill="#59636e" text-anchor="start" xml:space="preserve">U.S. Government Hall of Fame,</text><text x="0.0" y="432.8" font-family="disp500" font-size="17" fill="#59636e" text-anchor="start" xml:space="preserve">NASA included.</text><line x1="0" y1="456.8" x2="420" y2="456.8" stroke="#d1d9e0"/><text x="-1.0" y="510.8" font-family="disp800" font-size="46" fill="#1f2328" text-anchor="start" xml:space="preserve" letter-spacing="-1.38">93.75%</text><text x="0.0" y="540.8" font-family="disp500" font-size="17" fill="#59636e" text-anchor="start" xml:space="preserve">Accuracy across 15 valid</text><text x="0.0" y="564.8" font-family="disp500" font-size="17" fill="#59636e" text-anchor="start" xml:space="preserve">vulnerability reports.</text></svg>